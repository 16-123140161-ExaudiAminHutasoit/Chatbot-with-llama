<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="100%" stop-color="#0175C2" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Container -->
  <rect x="5" y="5" width="190" height="190" rx="40" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)" />
  
  <!-- BPS Official Symbol (3 Interlocking Blocks / Ribbons) -->
  <g transform="translate(20, 20)">
    <!-- Blue Block (Top Left) -->
    <path d="M 30,30 L 90,30 L 120,60 L 60,60 Z" fill="url(#blueGrad)" />
    <path d="M 30,30 L 60,60 L 60,110 L 30,80 Z" fill="#01579B" />
    
    <!-- Green Block (Top Right to Bottom) -->
    <path d="M 90,30 L 130,30 L 130,100 L 90,100 Z" fill="url(#greenGrad)" />
    <path d="M 90,100 L 130,100 L 110,130 L 70,130 Z" fill="#1B5E20" />
    
    <!-- Orange Ribbon (Bottom Left) -->
    <path d="M 30,80 L 60,110 L 110,130 L 70,130 Z" fill="url(#orangeGrad)" />
    <path d="M 30,80 L 70,130 L 50,130 L 10,80 Z" fill="#BF360C" />
  </g>

  <!-- BPS Text Subtitle -->
  <text x="100" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0F172A" text-anchor="middle" letter-spacing="2">BPS</text>
</svg>
